<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEMO Ticket Detail</title>
<style>
:root{
  --bg:#f9d1b7; --w1:#fff; --w3:#f4f4f4; --b1:#231916; --b2:#4b4b4b; --b3:#777;
  --accent:#ec660f; --pill:#333;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:62.5%}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--b1);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,Arial,sans-serif;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.page{
  min-height:100vh;
  max-width:48rem;
  margin:0 auto;
  padding:6.8rem 0 9rem;
  background:var(--bg);
  position:relative;
  overflow:hidden;
}
.header{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:48rem;height:6.8rem;z-index:30;
  background:rgba(255,255,255,.96);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;border-bottom:1px solid rgba(0,0,0,.05);
}
.logo{font-size:2.25rem;font-weight:700;letter-spacing:0;line-height:1;background:linear-gradient(90deg,#f3981c,#e95389,#8c93c3,#2badd7,#363483);-webkit-background-clip:text;background-clip:text;color:transparent}
.actions{display:flex;align-items:center;gap:1.4rem}.header .logo{white-space:nowrap}
.search{width:2.2rem;height:2.2rem;border:.22rem solid #333;border-radius:50%;position:relative;opacity:.8}
.search:after{content:"";position:absolute;width:1rem;height:.22rem;background:#333;right:-.65rem;bottom:.05rem;transform:rotate(45deg);border-radius:1rem}
.menu{width:2.6rem;display:flex;flex-direction:column;gap:.55rem}.menu span{height:.25rem;background:#333;border-radius:1rem}
.bg-words{
  position:absolute;top:8.2rem;left:-15rem;width:80rem;height:72rem;z-index:0;
  transform:rotate(-30deg);transform-origin:25rem 70rem;
  display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
}
.bg-row{white-space:nowrap;color:rgba(255,255,255,.46);font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-size:6.4rem;font-weight:700;letter-spacing:.06rem;animation:bgMove 24s linear infinite}
.bg-row:nth-child(even){animation-duration:28s;transform:translateX(-8rem)}
@keyframes bgMove{from{translate:0 0}to{translate:-34rem 0}}
.ticket-section{position:relative;z-index:2;padding:2.4rem 4.8rem 0}
.ticket{
  width:100%;max-width:38.4rem;margin:0 auto;position:relative;display:flex;flex-direction:column;
  filter:drop-shadow(0 0 12px rgba(0,0,0,.4));
}
.demo-ribbon{position:absolute;top:2.2rem;left:-4rem;z-index:20;width:16rem;text-align:center;transform:rotate(-35deg);background:#111;color:#fff;font-size:1.1rem;font-weight:900;letter-spacing:.08em;padding:.45rem 0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.image-area{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center}
.image-blur{position:absolute;inset:0;background:center/cover no-repeat;filter:blur(7px);transform:scale(1.08);z-index:0}
.image-main{position:relative;z-index:1;width:72%;height:86%;background:center/cover no-repeat;border-radius:.2rem;filter:drop-shadow(0 0 4px rgba(0,0,0,.4))}
.image-main.noimage{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffb37b,#f05f88,#4aa9e8);color:rgba(255,255,255,.85);font-size:3.2rem;font-weight:900;letter-spacing:.05em}
.stamp{display:none;position:absolute;right:.6rem;bottom:.6rem;width:14.8rem;height:14.8rem;z-index:20;border-radius:50%;overflow:hidden;pointer-events:none;background:rgba(255,255,255,.28);color:#ff0000;transform:scale(.72);transform-origin:right bottom}
.stamp.show{display:block}
.stamp .top,.stamp .stamp-bottom{position:absolute;left:0;right:0;width:100%;height:1.8rem;margin:0;padding:0;border:0;background:transparent;color:#ff0000;font-size:1.7rem;font-weight:700;line-height:1.8rem;text-align:center;letter-spacing:0;z-index:3;display:block;white-space:nowrap}
.stamp .top{top:1.45rem;bottom:auto;transform:none}
.stamp .stamp-bottom{top:auto;bottom:1.45rem;transform:rotate(180deg);transform-origin:center center}
.stamp .time{position:absolute;left:0;right:0;top:50%;width:100%;margin:0;padding:0;transform:translateY(-50%);font-size:2.7rem;font-weight:700;color:#ff0000;z-index:3;line-height:1;text-align:center;background:transparent;display:block;white-space:nowrap}
.circle{position:absolute;top:50%;left:50%;border-radius:50%;transform:translate(-50%,-50%);border:solid #ff0000;z-index:1;background:transparent}
.c1{width:14.4rem;height:14.4rem;border-width:.35rem}.c2{width:13.5rem;height:13.5rem;border-width:.1rem}.c3{width:8.8rem;height:8.8rem;border-width:.35rem}.c4{width:8rem;height:8rem;border-width:.1rem}
.details{
  background:#fff;padding:1.6rem 2rem;display:flex;flex-direction:column;gap:1.8rem;position:relative;
  --notch:12px;--notch-y:13.25rem;
  -webkit-mask:
    radial-gradient(circle var(--notch) at 0 0,transparent 99%,#000 100%),
    radial-gradient(circle var(--notch) at 100% 0,transparent 99%,#000 100%),
    radial-gradient(circle var(--notch) at 0 var(--notch-y),transparent 99%,#000 100%),
    radial-gradient(circle var(--notch) at 100% var(--notch-y),transparent 99%,#000 100%),
    radial-gradient(circle var(--notch) at 0 100%,transparent 99%,#000 100%),
    radial-gradient(circle var(--notch) at 100% 100%,transparent 99%,#000 100%),
    linear-gradient(#000,#000);
  -webkit-mask-composite:xor,xor,xor,xor,xor,xor,source-over;
}
.info{display:flex;flex-direction:column;gap:1.2rem;min-width:0}.line{width:100%;display:flex;overflow:hidden;white-space:nowrap;gap:1rem}.marquee{display:inline-block;animation:marquee 16s linear infinite}@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.event-name{font-size:2rem;line-height:150%;font-weight:700;color:var(--b1)}
.venue-row{display:flex;align-items:center;gap:.8rem;font-size:1.2rem;font-weight:700;color:var(--b1);white-space:nowrap}.inline-border{width:1px;height:14px;background:#eee;display:inline-block;flex:0 0 auto}
.date-row{display:flex;align-items:center;gap:.8rem;height:2.8rem}.date{font-family:Helvetica,Arial,sans-serif;font-size:2.8rem;font-weight:900;line-height:1}.weekday{font-size:1.6rem;font-weight:900}.vline{height:100%;width:1px;background:#eee}.timebox{display:flex;flex-direction:column;align-items:center;gap:.2rem;line-height:1}.label{font-size:1rem;color:var(--b3);font-weight:500}.value{font-size:1.6rem;font-weight:900}.dotted{height:1px;width:100%;background-image:repeating-linear-gradient(to right,#eee 0,#eee 4px,transparent 4px,transparent 8px)}
.holder{display:flex;align-items:center;justify-content:space-between;gap:1.6rem}.holder-left{display:flex;flex-direction:column;gap:1.2rem;min-width:0;flex:1;overflow:hidden;white-space:nowrap}.name-row{display:flex;align-items:center;gap:1.2rem;font-size:1.2rem}.name{font-weight:700;color:var(--b2)}.sama{font-weight:400;color:var(--b2)}.favorite{font-size:1.2rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ticket-name{font-size:1.6rem;font-weight:800}.number{background:var(--accent);border-radius:2px;color:#fff;padding:1.1rem .8rem;font-size:2.4rem;font-weight:900;line-height:1;white-space:nowrap}
.note{margin:1.4rem auto 0;max-width:34rem;text-align:center;color:rgba(255,255,255,.95);font-size:1.15rem;font-weight:800;line-height:1.6;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:48rem;height:8.2rem;z-index:30;background:rgba(255,255,255,.88);border-top:1px solid rgba(0,0,0,.06);backdrop-filter:blur(8px);display:flex;align-items:center;gap:1.4rem;padding:.8rem 1.6rem .8rem 2rem}.bottom-left{display:flex;gap:1.4rem;flex:0 0 auto}.bottom-item{width:4.8rem;text-align:center;color:#344;display:flex;flex-direction:column;align-items:center;gap:.45rem;font-size:1.15rem;font-weight:800}.icon{font-size:2rem;line-height:1}.slider{position:relative;height:5.8rem;flex:1;min-width:0;border-radius:3.2rem;background:var(--bg);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}.slider.done{background:#333}.slider-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#666;font-size:1.45rem;font-weight:900;line-height:1.22;pointer-events:none}.slider.done .slider-text{color:#fff}.small{font-size:1.1rem;font-weight:700}.knob{position:absolute;top:.55rem;left:.55rem;width:4.7rem;height:4.7rem;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:2.7rem;font-weight:700;color:#555;cursor:grab;user-select:none;touch-action:none}.knob:active{cursor:grabbing}
.toast{position:fixed;left:50%;bottom:9.4rem;transform:translateX(-50%) translateY(1rem);background:rgba(0,0,0,.82);color:#fff;border-radius:999px;padding:.9rem 1.4rem;font-size:1.3rem;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:40}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:390px){.stamp{transform:scale(.68)} .ticket-section{padding-left:3.4rem;padding-right:3.4rem}.event-name{font-size:1.85rem}.number{font-size:2rem}.bottom{gap:1rem;padding-left:1.4rem;padding-right:1.2rem}.bottom-left{gap:.8rem}.bottom-item{width:4.4rem;font-size:1.05rem}.slider-text{font-size:1.32rem}.small{font-size:1rem}}
@media(max-width:340px){.ticket-section{padding-left:2.6rem;padding-right:2.6rem}.details{padding:1.4rem 1.6rem}.date{font-size:2.5rem}.number{padding:1rem .65rem}}
</style>
</head>
<body>
<main class="page" id="page">
  <header class="header"><div class="logo">TicketDive</div><div class="actions"><div class="search"></div><div class="menu"><span></span><span></span><span></span></div></div></header>
  <div class="bg-words" aria-hidden="true"><div class="bg-row">TicketDive TicketDive TicketDive</div><div class="bg-row">TicketDive TicketDive TicketDive</div><div class="bg-row">TicketDive TicketDive TicketDive</div><div class="bg-row">TicketDive TicketDive TicketDive</div><div class="bg-row">TicketDive TicketDive TicketDive</div><div class="bg-row">TicketDive TicketDive TicketDive</div></div>
  <section class="ticket-section">
    <div class="ticket">
      <div class="image-area"><div class="image-blur" id="imageBlur"></div><div class="image-main" id="imageMain">DEMO</div><div class="stamp" id="stamp"><span class="top">入場済</span><span class="time" id="stampTime">--:--</span><span class="stamp-bottom">入場済</span><i class="circle c1"></i><i class="circle c2"></i><i class="circle c3"></i><i class="circle c4"></i></div></div>
      <div class="details">
        <div class="info">
          <div class="line"><div class="marquee"><span class="event-name" id="title1"></span>&nbsp;&nbsp;&nbsp;</div><div class="marquee"><span class="event-name" id="title2"></span>&nbsp;&nbsp;&nbsp;</div></div>
          <div class="line"><div class="marquee venue-row"><span id="venue1"></span><span class="inline-border"></span><span id="sub1"></span></div><div class="marquee venue-row"><span id="venue2"></span><span class="inline-border"></span><span id="sub2"></span></div></div>
          <div class="date-row"><span class="date" id="date"></span><span class="weekday" id="weekday"></span><span class="vline"></span><span class="timebox"><span class="label">OPEN</span><span class="value" id="openTime"></span></span><span class="timebox"><span class="label">START</span><span class="value" id="startTime"></span></span></div>
        </div>
        <div class="dotted"></div>
        <div class="holder"><div class="holder-left"><div class="name-row"><span><span class="name" id="buyerName"></span><span class="sama">さま</span></span><span class="inline-border"></span><span class="favorite" id="favorite"></span></div><div class="line"><div class="marquee"><span class="ticket-name" id="ticketName1"></span>&nbsp;&nbsp;&nbsp;</div><div class="marquee"><span class="ticket-name" id="ticketName2"></span>&nbsp;&nbsp;&nbsp;</div></div></div><div class="number" id="ticketType"></div></div>
      </div>
    </div>
    
  </section>
  <nav class="bottom"><div class="bottom-left"><button class="bottom-item" type="button" onclick="showToast('デモのため分配できません')"><span class="icon">↕</span><span>分配</span></button><button class="bottom-item" type="button" onclick="showToast('イベント詳細のデモです')"><span class="icon">↗</span><span>詳細</span></button></div><div class="slider" id="slider"><div class="slider-text" id="sliderText">入場する<br><span class="small">（開始直前より利用可能）</span></div><div class="knob" id="knob">›</div></div></nav>
  <div class="toast" id="toast"></div>
</main>
<script>
const params = new URLSearchParams(location.search);
const data = {
  image: params.get('image') || 'https://storage.googleapis.com/playyte-ticket-prod_event/oSKEcfB0O9Zh8m0VSwuV_895248_1782217279208.webp',
  title: params.get('title') || 'SPARK 2026 渋谷納涼祭',
  venue: params.get('venue') || 'ベルサール渋谷ガーデン / Spotify O-nest / SHIBUYA DESEO / SHIBUYA THE GAME / チェルシーホテル',
  date: params.get('date') || '7.11', weekday: params.get('weekday') || '土',
  openTime: params.get('openTime') || '9:00', startTime: params.get('startTime') || '9:30',
  name: params.get('name') || 'デモ太郎', favorite: params.get('favorite') || 'ハニースパイスRe.',
  ticketName: params.get('ticketName') || '【DAY1】VIPチケット先行抽選', ticketType: params.get('ticketType') || 'S10',
  bodyColor: params.get('bodyColor') || '#f9d1b7', ticketColor: params.get('ticketColor') || '#ec660f'
};
document.documentElement.style.setProperty('--bg', data.bodyColor);
document.documentElement.style.setProperty('--accent', data.ticketColor);
['title1','title2'].forEach(id=>document.getElementById(id).textContent=data.title);
['venue1','venue2'].forEach(id=>document.getElementById(id).textContent=data.venue);
['sub1','sub2'].forEach(id=>document.getElementById(id).textContent=data.title + ' DAY1');
document.getElementById('date').textContent=data.date; document.getElementById('weekday').textContent=data.weekday; document.getElementById('openTime').textContent=data.openTime; document.getElementById('startTime').textContent=data.startTime; document.getElementById('buyerName').textContent=data.name; document.getElementById('favorite').textContent=data.favorite; document.getElementById('ticketName1').textContent=data.ticketName; document.getElementById('ticketName2').textContent=data.ticketName; document.getElementById('ticketType').textContent=data.ticketType;
const imgMain=document.getElementById('imageMain'), imgBlur=document.getElementById('imageBlur');
if(data.image.trim()) { imgMain.textContent=''; imgMain.classList.remove('noimage'); imgMain.style.backgroundImage=`url('${data.image}')`; imgBlur.style.backgroundImage=`url('${data.image}')`; } else { imgMain.classList.add('noimage'); imgMain.textContent='DEMO'; }
const knob=document.getElementById('knob'), slider=document.getElementById('slider'), sliderText=document.getElementById('sliderText'), stamp=document.getElementById('stamp'), stampTime=document.getElementById('stampTime');
let dragging=false,startX=0,currentX=0,maxX=0,done=false;
function clientX(e){return e.touches?e.touches[0].clientX:e.clientX}
function start(e){if(done)return;dragging=true;startX=clientX(e);maxX=slider.clientWidth-knob.clientWidth-11;knob.style.transition='none';if(e.cancelable)e.preventDefault()}
function move(e){if(!dragging||done)return;currentX=clientX(e)-startX;currentX=Math.max(0,Math.min(currentX,maxX));knob.style.left=(currentX+5.5)+'px';if(e.cancelable)e.preventDefault()}
function end(){if(!dragging||done)return;dragging=false;if(currentX>maxX*.85){complete()}else{knob.style.transition='left .2s ease';knob.style.left='.55rem';currentX=0}}
function complete(){done=true;const now=new Date();stampTime.textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');stamp.classList.add('show');slider.classList.add('done');sliderText.textContent='QRコードにより入場済';knob.style.transition='left .2s ease';knob.style.left=(maxX+5.5)+'px';knob.textContent='✓';showToast('入場済にしました')}
knob.addEventListener('mousedown',start);document.addEventListener('mousemove',move);document.addEventListener('mouseup',end);knob.addEventListener('touchstart',start,{passive:false});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',end);
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
</script>
</body>
</html>
